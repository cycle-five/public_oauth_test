<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nothing typed here leaves the machine: a service worker answers the fetch() post. -->
    <!-- connect-src 'self' is the one directive added beyond the classic pages' CSP: the
         classic default-src 'none' blocks fetch(), and this page submits via fetch() to
         /login/api/session, which the service worker answers. Same-origin only. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; worker-src 'self'; form-action 'self'; base-uri 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Login Test Page - Script Driven</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 14px;
        }

        .status[data-state="idle"] {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status[data-state="success"] {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status[data-state="error"] {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        form {
            margin: 30px 0 20px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            font: inherit;
            font-size: 16px;
            color: #333;
            background: white;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }

        input:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        button {
            padding: 10px 24px;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: #5a67d8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #4c56b8;
        }

        button.secondary {
            color: #333;
            background: #e2e6ea;
        }

        button.secondary:hover {
            background: #d3d9df;
        }

        .panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .panel p + p {
            margin-top: 8px;
        }

        .panel.note {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
        }

        .panel table {
            border-collapse: collapse;
            margin-top: 4px;
        }

        .panel th {
            text-align: left;
            font-weight: 600;
            color: #333;
            padding: 3px 16px 3px 0;
        }

        .panel td {
            padding: 3px 0;
            font-variant-numeric: tabular-nums;
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            background: #eef0f3;
            padding: 1px 5px;
            border-radius: 4px;
            overflow-wrap: anywhere;
        }

        .panel ul {
            margin: 8px 0 0 20px;
        }

        .panel li {
            margin: 4px 0;
        }

        [hidden] {
            display: none !important;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        .footer a,
        .subtitle a {
            color: #5a67d8;
        }

        @media (max-width: 480px) {
            .container { padding: 24px; }
            form { padding: 20px; }
        }
    
        fieldset {
            border: 0;
            min-width: 0;
        }

        .line {
            font-size: 14px;
            color: #555;
            margin: 10px 0;
        }

        .status[data-state="not_ready"] {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>🔑 Login Test Page</h1>
        <p class="subtitle">A script-driven form that submits with fetch() instead of navigating</p>

        <div id="login-status" class="status" data-state="not_ready" role="status" aria-live="polite">
            <strong>Status:</strong> <span id="login-status-text">Starting…</span>
        </div>

        <form id="login-form" novalidate>
            <fieldset disabled>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username"
                       autocapitalize="none" autocorrect="off" spellcheck="false">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password">

                <button type="submit" id="submit">Log in</button>
            </fieldset>
        </form>

        <p id="fill-report" class="line" data-username-length="0" data-password-length="0">
            Fields hold <span id="username-length">0</span> / <span id="password-length">0</span> characters (username / password).
        </p>

        <p class="line">Any non-empty username and password is accepted.</p>

        <div class="footer">
            <p><a href="about.html">How this works</a> • <a href="/login.html">Strict login</a></p>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            var MISSING = 'Enter a username and a password';

            var form = document.getElementById('login-form');
            var fieldset = form.querySelector('fieldset');
            var username = document.getElementById('username');
            var password = document.getElementById('password');
            var status = document.getElementById('login-status');
            var statusText = document.getElementById('login-status-text');
            var report = document.getElementById('fill-report');
            var usernameLength = document.getElementById('username-length');
            var passwordLength = document.getElementById('password-length');

            function setStatus(state, text) {
                status.dataset.state = state;
                statusText.textContent = text;
            }

            // Lengths only, never the values.
            function updateReport() {
                var u = String(username.value.length);
                var p = String(password.value.length);
                if (report.dataset.usernameLength !== u) {
                    report.dataset.usernameLength = u;
                    usernameLength.textContent = u;
                }
                if (report.dataset.passwordLength !== p) {
                    report.dataset.passwordLength = p;
                    passwordLength.textContent = p;
                }
            }

            username.addEventListener('input', updateReport);
            password.addEventListener('input', updateReport);
            username.addEventListener('change', updateReport);
            password.addEventListener('change', updateReport);
            // Some fillers set .value directly and fire no event, so poll too.
            setInterval(updateReport, 250);

            // Submit receipt: what was in the fields at the moment of submit, as lengths
            // only. With ?expect=<sha256 hex of "username:password"> it also says whether
            // the pair matched that digest. Never the values.
            var expect = new URLSearchParams(location.search).get('expect');
            if (expect === null || !/^[0-9a-f]{64}$/.test(expect)) expect = null;

            // Synchronous on purpose: the reading is taken inside the submit event,
            // before the document can navigate away.
            function sha256Hex(text) {
                var bytes = new TextEncoder().encode(text);
                var K = [], H = [], composite = {}, c = 2;
                while (K.length < 64) {
                    if (!composite[c]) {
                        for (var m = c * c; m < 312; m += c) composite[m] = true;
                        if (H.length < 8) H.push((Math.pow(c, 1 / 2) * 4294967296) | 0);
                        K.push((Math.pow(c, 1 / 3) * 4294967296) | 0);
                    }
                    c++;
                }
                var len = bytes.length;
                var total = ((len + 9 + 63) >> 6) << 6;
                var buf = new Uint8Array(total);
                buf.set(bytes);
                buf[len] = 0x80;
                var view = new DataView(buf.buffer);
                view.setUint32(total - 8, Math.floor(len / 536870912));
                view.setUint32(total - 4, (len << 3) >>> 0);
                var w = new Int32Array(64);
                function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
                for (var off = 0; off < total; off += 64) {
                    var a = H[0], b = H[1], d = H[2], e = H[3], f = H[4], g = H[5], h = H[6], i = H[7];
                    for (var t = 0; t < 64; t++) {
                        if (t < 16) {
                            w[t] = view.getInt32(off + t * 4);
                        } else {
                            var x = w[t - 15], y = w[t - 2];
                            w[t] = (w[t - 16] + (rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3)) +
                                    w[t - 7] + (rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10))) | 0;
                        }
                        var t1 = (i + (rotr(f, 6) ^ rotr(f, 11) ^ rotr(f, 25)) + ((f & g) ^ (~f & h)) + K[t] + w[t]) | 0;
                        var t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & d) ^ (b & d))) | 0;
                        i = h; h = g; g = f; f = (e + t1) | 0; e = d; d = b; b = a; a = (t1 + t2) | 0;
                    }
                    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + d) | 0; H[3] = (H[3] + e) | 0;
                    H[4] = (H[4] + f) | 0; H[5] = (H[5] + g) | 0; H[6] = (H[6] + h) | 0; H[7] = (H[7] + i) | 0;
                }
                return H.map(function (v) { return ('00000000' + (v >>> 0).toString(16)).slice(-8); }).join('');
            }

            function receipt() {
                var r = { u: username.value.length, p: password.value.length };
                if (expect !== null) r.m = sha256Hex(username.value + ':' + password.value) === expect;
                return r;
            }

            function renderReceipt(el, r) {
                el.dataset.recorded = 'true';
                el.dataset.usernameLength = String(r.u);
                el.dataset.passwordLength = String(r.p);
                var text = 'Submitted ' + r.u + ' / ' + r.p + ' characters (username / password).';
                if (typeof r.m === 'boolean') {
                    el.dataset.match = String(r.m);
                    text += r.m ? ' Matches the expected digest.' : ' Does not match the expected digest.';
                } else {
                    delete el.dataset.match;
                }
                el.textContent = text;
            }

            function enable() {
                fieldset.disabled = false;
                form.setAttribute('data-ready', 'true');
                setStatus('idle', 'Ready');
            }

            function showLoggedIn(r) {
                var panel = document.createElement('div');
                panel.id = 'logged-in';
                panel.className = 'panel';
                var p = document.createElement('p');
                var strong = document.createElement('strong');
                strong.textContent = 'Logged in';
                p.appendChild(strong);
                var out = document.createElement('p');
                var link = document.createElement('a');
                link.id = 'logout';
                link.href = '/login/spa.html';
                link.textContent = 'Log out';
                out.appendChild(link);
                var sent = document.createElement('p');
                sent.id = 'submit-report';
                renderReceipt(sent, r);
                panel.appendChild(p);
                panel.appendChild(sent);
                panel.appendChild(out);
                form.parentNode.replaceChild(panel, form);
                setStatus('idle', 'Logged in');
                history.pushState({}, '', '/login/spa.html#in');
            }

            // Always script-handled: the form never navigates the document.
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                if (!navigator.serviceWorker || !navigator.serviceWorker.controller) {
                    setStatus('not_ready', 'Reload this page normally');
                    return;
                }
                var r = receipt();
                fetch('/login/api/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username.value, password: password.value })
                }).then(function (res) {
                    if (res.ok) showLoggedIn(r);
                    else setStatus('error', MISSING);
                }, function () {
                    setStatus('error', 'Login failed — try again');
                });
            });

            if (!('serviceWorker' in navigator)) {
                setStatus('not_ready', 'Service workers unavailable — reload this page normally');
            } else {
                setStatus('not_ready', 'Starting…');
                navigator.serviceWorker.register('/sw.js', { scope: '/login' }).then(function () {
                    if (navigator.serviceWorker.controller) {
                        enable();
                        return;
                    }
                    var done = false;
                    navigator.serviceWorker.addEventListener('controllerchange', function () {
                        if (!done && navigator.serviceWorker.controller) {
                            done = true;
                            enable();
                        }
                    });
                    setTimeout(function () {
                        if (!done && !navigator.serviceWorker.controller) {
                            setStatus('not_ready', 'Reload this page normally');
                        }
                    }, 3000);
                }, function () {
                    setStatus('not_ready', 'Could not start — reload this page normally');
                });
            }

            updateReport();
        })();
    </script>
</body>
</html>
