<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; worker-src 'self'; form-action 'self'; base-uri 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Logged in - Login Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 14px;
        }

        .status[data-state="idle"] {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status[data-state="success"] {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status[data-state="error"] {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        form {
            margin: 30px 0 20px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            font: inherit;
            font-size: 16px;
            color: #333;
            background: white;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }

        input:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        button {
            padding: 10px 24px;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: #5a67d8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #4c56b8;
        }

        button.secondary {
            color: #333;
            background: #e2e6ea;
        }

        button.secondary:hover {
            background: #d3d9df;
        }

        .panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .panel p + p {
            margin-top: 8px;
        }

        .panel.note {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
        }

        .panel table {
            border-collapse: collapse;
            margin-top: 4px;
        }

        .panel th {
            text-align: left;
            font-weight: 600;
            color: #333;
            padding: 3px 16px 3px 0;
        }

        .panel td {
            padding: 3px 0;
            font-variant-numeric: tabular-nums;
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            background: #eef0f3;
            padding: 1px 5px;
            border-radius: 4px;
            overflow-wrap: anywhere;
        }

        .panel ul {
            margin: 8px 0 0 20px;
        }

        .panel li {
            margin: 4px 0;
        }

        [hidden] {
            display: none !important;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        .footer a,
        .subtitle a {
            color: #5a67d8;
        }

        @media (max-width: 480px) {
            .container { padding: 24px; }
            form { padding: 20px; }
        }
    
        fieldset {
            border: 0;
            min-width: 0;
        }

        .line {
            font-size: 14px;
            color: #555;
            margin: 10px 0;
        }

        .status[data-state="not_ready"] {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>🔑 Login Test Page</h1>
        <div id="login-status" class="status" data-state="success" role="status" aria-live="polite">
            <strong>Status:</strong> <span id="login-status-text">Logged in</span>
        </div>
        <p id="submit-report" class="line" data-recorded="false">No submit receipt in this tab.</p>
        <p class="line"><a id="logout" href="/login.html">Log out</a></p>
    </main>
    <script>
        (function () {
            'use strict';
            // Fixed allowlist: the "from" value is only a key, never rendered.
            var TARGETS = { strict: '/login.html', any: '/login/any.html' };
            var from = new URLSearchParams(location.search).get('from');
            var href = (from !== null && Object.prototype.hasOwnProperty.call(TARGETS, from)) ? TARGETS[from] : '/login.html';
            document.getElementById('logout').setAttribute('href', href);

            function renderReceipt(el, r) {
                el.dataset.recorded = 'true';
                el.dataset.usernameLength = String(r.u);
                el.dataset.passwordLength = String(r.p);
                var text = 'Submitted ' + r.u + ' / ' + r.p + ' characters (username / password).';
                if (typeof r.m === 'boolean') {
                    el.dataset.match = String(r.m);
                    text += r.m ? ' Matches the expected digest.' : ' Does not match the expected digest.';
                } else {
                    delete el.dataset.match;
                }
                el.textContent = text;
            }

            // Written by the login page at submit: lengths and an optional yes/no,
            // never the values. Anything that is not exactly that shape is ignored.
            function count(v) { return typeof v === 'number' && Number.isInteger(v) && v >= 0; }
            try {
                var r = JSON.parse(sessionStorage.getItem('login-test:last-submit'));
                if (r && count(r.u) && count(r.p)) {
                    renderReceipt(document.getElementById('submit-report'), {
                        u: r.u, p: r.p, m: typeof r.m === 'boolean' ? r.m : undefined
                    });
                }
            } catch (e) { /* no receipt */ }
        })();
    </script>
</body>
</html>
