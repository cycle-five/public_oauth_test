[pytest]
# Pytest configuration for OAuth testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Markers for test categorization
markers =
    oauth: OAuth integration tests (may require credentials)
    headless: Tests that run in headless mode
    manual: Tests requiring manual interaction (2FA, security keys)
    slow: Slow running tests
    unit: Fast unit tests
    integration: Integration tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeouts (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Coverage options (requires pytest-cov)
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
