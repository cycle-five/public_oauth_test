name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage publishable files
        run: |
          mkdir _site
          rsync -a \
            --exclude '/.git' \
            --exclude '/tests' \
            --exclude '/docs' \
            --exclude '/_site' \
            --exclude 'node_modules' \
            ./ _site/

      - name: Write config.js
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
          OUT: _site/config.js
        run: bash scripts/write-config.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
